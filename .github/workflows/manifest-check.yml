name: manifest-check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: skill 登錄與入口是否一致
        run: ./scripts/check-manifest.sh
      - name: 維護 skill 設定契約是否一致
        if: always()
        run: python3 scripts/check-config-contract.py
      - name: 中文文件是否符合 de-ai-tone
        if: always() # manifest 壞掉時也要看到文風問題，一次修完
        run: python3 scripts/check-de-ai-tone.py
