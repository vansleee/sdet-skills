name: manifest-check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: plugin.json 與 skills/ 是否一致
        run: ./scripts/check-manifest.sh
      - name: 中文文件是否符合 de-ai-tone
        if: always() # manifest 壞掉時也要看到文風問題，一次修完
        run: python3 scripts/check-de-ai-tone.py
