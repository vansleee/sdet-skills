# 探索憲章（exploration charter）
# 由 exploration-charter 產生、供 explore 讀取的輸入。
# 位置慣例：charters/<slug>.yaml（committed；evidence/ 才是每次跑的輸出、被 gitignore）
# 加 tour 只需多一行，例如：tours: [data]（見 Day 16）
charter:
  goal: "在 Bug Hunting build（with-bugs.practicesoftwaretesting.com）獵一輪 bug，含註冊/付款/API/安全類（非破壞性）"
  target: "https://with-bugs.practicesoftwaretesting.com/#/?bug-hunting=true"
  scope: [登入頁, 商品頁, 購物車, 註冊, 付款, 結帳表單, 個人資料, 聯絡表單, API 授權, 安全]
  oracles:
    - "UI 顯示的結果要與 API 狀態碼一致"
    - "正常操作不應出現 console error"
    - "安全預期：不應能不用密碼登入、不應外洩密碼提示、鎖定閾值不應過低、輸入應被驗證"
  test_account: customer@practicesoftwaretesting.com
  max_steps: 40

  # --- 授權分級（2026-07-30 由 wclee 拍板；subagent 必須逐條遵守）---
  authorization:
    allowed:
      - "註冊：可真的送出建立帳號，但 email 必須帶唯一時間戳標記（例：sdet+<ts>@example.com），只建測試帳號"
      - "付款：可完整走完結帳含按下最後的下單／確認鈕（demo sandbox，無真金流）"
      - "安全（非破壞性）：SQL injection 只驗證『能否不用密碼登入』後立即登出、觀察密碼提示是否外洩、量測帳號鎖定閾值、檢查登入/表單驗證是否缺失"
    forbidden:
      - "不得寫入或修改『既有』他人資料（只能動自己新建的測試帳號）"
      - "不得刪除任何 brand / product / 他人帳號（#19 那類破壞性寫入一律不做，只記『看起來可疑、需人工授權才驗』）"
      - "不得使用或嘗試取得 admin token"
      - "不得對非 with-bugs 的站台（正式站、其他網域）做任何安全測試"
      - "SQLi 僅止於單一登入繞過的存在性驗證，不得列舉資料、不得 UNION/dump、不得自動化打多筆"
  out_of_bounds: [正式站寫入, 刪除共享資料, admin 權限, 資料庫 dump]
