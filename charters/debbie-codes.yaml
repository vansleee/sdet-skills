# 探索章程（exploration charter）
# 由 /explore 依使用者指定目標 inline 產生。
charter:
  goal: "在 debbie.codes 個人網站獵一輪 bug：導覽與路由、文章列表與內頁、搜尋、主題切換、RWD、a11y 與 console/network 健康度"
  target: "https://debbie.codes/"
  scope:
    - 首頁載入與主要區塊
    - 主導覽各連結可達性
    - 文章列表與分頁／標籤
    - 文章內頁渲染（圖片、程式碼區塊、連結）
    - 站內搜尋（若有）
    - 深淺色主題切換與持久化
    - 404／未知路由
    - 行動裝置 viewport 排版
    - 鍵盤操作與焦點可見性
    - console error 與失敗網路請求
  oracles:
    - "內部一致性：導覽連結指向的頁面必須存在且標題與連結文字相符；列表筆數與實際卡片數一致"
    - "正常瀏覽不應出現 console error；主要資源不得回 4xx/5xx（第三方分析類另計為 environment）"
    - "路由：未知路徑應回可辨識的 404 頁而非白畫面或無限載入"
    - "主題切換：切換後即時生效，且 reload 後保留選擇"
    - "RWD：375px 寬不得出現橫向捲動或內容被裁切"
    - "a11y：可見焦點指示、圖片有 alt、互動元素可用鍵盤觸發"
    - "使用者期待：外部連結不應死鏈；返回上一頁應回到原捲動位置的列表"
  max_steps: 40

  authorization:
    allowed:
      - "唯讀瀏覽：導覽、點連結、改路由、reload、resize viewport"
      - "在站內搜尋框輸入查詢字串（純前端／唯讀查詢）"
      - "切換主題、讀 localStorage"
    forbidden:
      - "不得訂閱電子報／送出聯絡表單／任何會寄信或寫入他人系統的動作"
      - "不得掃描、壓測、爆破路徑、高頻打站（單次探索、人類節奏）"
      - "不得在任何輸入框送出 XSS／注入 payload（他人正式站，非授權測試標的）"
      - "不得離開 debbie.codes 網域做互動（外部連結只驗 HTTP 狀態，不深入操作）"
  out_of_bounds: [壓測, 弱點掃描, 表單送出, 電子報訂閱, 注入測試, 其他網域的互動]
