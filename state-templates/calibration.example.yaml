# 計分規則見 references/confidence.md。
# 寫它的：hunter 記 predicted；呼叫端／gate 回填 verifier；明確人判才填 human。
# 唯一鍵為 project + session + finding_id；fingerprint 只用於跨輪關聯。
#
# 讀法：
#   打 high 卻常被打槍          → 系統性過度自信，調高門檻或降低單次複現的配分
#   後來確認的真 bug 常被壓 low → 太保守，漏報成本高

