# Release 簽核紀錄（範本 — 複製成 signoffs/<version>.yaml；真檔已 gitignore）
#
# 寫它的 skill：release-signoff。讀它的：人（稽核）、status-report（引用裁決）。
#
# 三層閘門，各有各的檔，不共用：
#   gate.yaml           = 一張 issue 能不能開      （agents/issue-quality-gate）
#   pipeline-gate.yaml  = 一個 build 能不能放行    （infra/quality-gate）
#   signoffs/<v>.yaml   = 整個 release 能不能簽出去（本檔）
#
# 準則門檻（high_risk_threshold / max_expired）放 config/sdet-config.yaml 的 signoff 區塊。
# 裁決：全 pass → go；任一 fail → no-go；有 inconclusive 或下層 OVERRIDE → conditional-go。
# inconclusive 一律不得當 pass。

version: v2.4.0
evaluated_at: 2026-07-29T14:00:00Z

checks:
  high_risk_covered:
    result: fail
    basis: "REQ-CHECKOUT-006（折扣碼 × 點數）risk_score 0.71 ≥ 門檻，但 traceability.yaml 標 gap"
  no_open_blocker:
    result: pass
    basis: "milestone v2.4.0 無 open blocker（gh issue list --milestone v2.4.0 --label blocker）"
  build_gate_passed:
    result: pass
    basis: "pipeline-gate.yaml 2026-07-29 PASS @ abc1234"
  known_issues_registered:
    result: pass
    basis: "3 筆已知非 blocker 問題皆列冊且有 owner（issues-index.yaml）"
  quarantine_disclosed:
    result: pass
    basis: "flaky-registry.yaml：隔離 9 支，逾期 2 ≤ max_expired 3"

verdict: no-go                 # go | no-go | conditional-go

quarantine_note: >
  本版有 9 支測試被隔離（含 checkout/coupon、cart/remove、login/sso），
  該區覆蓋為關閉狀態——放行判斷需把這塊視為未測。

completion_plan:               # no-go 必附：讓「不能出」變成可執行的待辦
  - what: "補 REQ-CHECKOUT-006（折扣碼與會員點數併用）的測試"
    who: "<github handle>"
    eta: "2 天"
    next: "交 test-planning 排範圍 → test-author 固化"

conditions: []                 # conditional-go 時填，每條必須可檢查：
                               # - "上線後 24h 內結帳錯誤率 > 1% 即回滾，由 <who> 監控 <dashboard>"

signed_by: null                # 由人填（誰、何時）；agent 不代簽
note: "This assessment was compiled by AI. The sign-off decision belongs to a human."
